# Tag v* (for example v0.2.0): make the GitHub release.
# Notes = the "## [x.y.z]" section of CHANGELOG.md, with feature doc links and demo images.
# No section for the tag: the job fails. Rules: CONTRIBUTING.md#feature-docs-and-releases
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check docs
        run: node scripts/check-docs.mjs

      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/check-docs.mjs --notes "$GITHUB_REF_NAME" > notes.md
          {
            echo
            echo "Image: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sqlwb-web:${GITHUB_REF_NAME#v}\`"
          } >> notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
